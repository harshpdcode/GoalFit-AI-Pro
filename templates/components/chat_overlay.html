{% if coach %}
<div id="chat-overlay" class="chat-overlay">
    <div class="chat-header" onclick="toggleChat()">
        <div class="d-flex align-items-center gap-2">
            <div class="avatar-circle" style="width: 32px; height: 32px; font-size: 14px; background: rgba(255,255,255,0.22); color: var(--text-on-accent); display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0;">
                {{ coach.prof_name[0]|upper }}
            </div>
            <div>
                <h6 class="mb-0 fw-bold" style="color: var(--text-on-accent); font-size: 0.92rem; line-height: 1.2;">{{ coach.prof_name }}</h6>
                <small style="color: var(--text-on-accent); opacity: 0.85; font-size: 0.73rem;">{{ coach.role|title }}</small>
            </div>
        </div>
        <i data-lucide="chevron-up" id="chat-toggle-icon" style="stroke: var(--text-on-accent);"></i>
    </div>
    
    <div class="chat-body" id="chat-body">
        <div id="chat-messages" class="p-3 d-flex flex-column gap-2" style="height: 300px; overflow-y: auto; background: var(--bg-card);">
            <!-- Messages load here -->
        </div>
        <div class="chat-input p-3" style="background: var(--bg-secondary); border-top: 1px solid var(--border-subtle);">
            <form id="chat-form" class="d-flex gap-2">
                <input type="text" id="chat-input-msg" class="form-control" style="background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 10px;" placeholder="Type a message..." required>
                <button type="submit" class="btn" style="background: var(--accent-gradient); color: var(--text-on-accent); border: none; border-radius: 10px; padding: 0 16px;"><i data-lucide="send" style="width: 16px; stroke: var(--text-on-accent);"></i></button>
            </form>
        </div>
    </div>
</div>

<style>
.chat-overlay {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 340px;
    background: var(--bg-card);
    border-radius: 16px;
    box-shadow: var(--shadow-dark);
    z-index: 9995;
    overflow: hidden;
    transition: all 0.3s ease;
    border: 1px solid var(--border-subtle);
}
.chat-header {
    background: var(--accent-gradient);
    color: var(--text-on-accent);
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
@media (max-width: 768px) {
    .chat-overlay {
        bottom: 85px !important;
        right: 12px !important;
        width: calc(100vw - 24px) !important;
        max-width: 360px !important;
    }
}
.chat-body {
    display: none;
}
.chat-body.active {
    display: block;
}
.chat-message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.88rem;
    margin-bottom: 4px;
    line-height: 1.4;
}
.chat-message.sent {
    background: var(--accent-gradient);
    color: var(--text-on-accent);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
}
.chat-message.received {
    background: var(--bg-input);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
</style>

<script>
const proId = "{{ coach.professional_id }}";
const proRole = "{{ coach.role }}";

function toggleChat() {
    const body = document.getElementById('chat-body');
    const icon = document.getElementById('chat-toggle-icon');
    body.classList.toggle('active');
    
    if(body.classList.contains('active')) {
        icon.setAttribute('data-lucide', 'chevron-down');
        loadMessages();
        // Set an interval to poll messages while chat is open
        if(!window.chatInterval) {
            window.chatInterval = setInterval(loadMessages, 5000);
        }
    } else {
        icon.setAttribute('data-lucide', 'chevron-up');
        if(window.chatInterval) {
            clearInterval(window.chatInterval);
            window.chatInterval = null;
        }
    }
    lucide.createIcons();
}

async function loadMessages() {
    try {
        const res = await fetch(`/chat/history?other_id=${proId}&other_role=${proRole}`);
        const messages = await res.json();
        
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        
        messages.forEach(msg => {
            const div = document.createElement('div');
            // If sender is the user
            const isSent = msg.sender_role === '{{ current_role }}' && msg.sender_id == '{{ session.user_id }}';
            div.className = `chat-message ${isSent ? 'sent' : 'received'}`;
            div.textContent = msg.message;
            container.appendChild(div);
        });
        
        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
    } catch (e) {
        console.error("Failed to load chat history", e);
    }
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input-msg');
    const message = input.value.trim();
    if(!message) return;
    
    try {
        const res = await fetch('/chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                receiver_id: proId,
                receiver_role: proRole,
                message: message
            })
        });
        const data = await res.json();
        if(data.success) {
            input.value = '';
            loadMessages();
        }
    } catch(e) {
        console.error("Failed to send message", e);
    }
});
</script>
{% endif %}

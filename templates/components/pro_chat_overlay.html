{% if client %}
<!-- Floating Circular Draggable Chat Trigger Button -->
<div id="pro-chat-circle-btn" class="pro-chat-circle-btn" title="Chat with {{ client.name }}">
    <div class="pro-avatar-circle-inner">
        {{ client.name[0]|upper }}
    </div>
    <span id="pro-chat-badge" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
        style="display:none; font-size:0.65rem;">New</span>
</div>

<!-- Floating Expandable Chat Box -->
<div id="chat-overlay" class="chat-overlay">
    <div class="chat-header">
        <div class="d-flex align-items-center gap-2">
            <div class="avatar-circle"
                style="width: 34px; height: 34px; font-size: 14px; background: rgba(0, 242, 254, 0.2); color: #00f2fe; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0; border: 1px solid rgba(0, 242, 254, 0.4);">
                {{ client.name[0]|upper }}
            </div>
            <div>
                <h6 class="mb-0 fw-bold" style="color: #ffffff; font-size: 0.92rem; line-height: 1.2;">{{ client.name }}
                </h6>
                <small style="color: rgba(255,255,255,0.7); font-size: 0.73rem;">Client</small>
            </div>
        </div>
        <button type="button" class="btn btn-sm p-1 text-white opacity-75 opacity-100-hover" onclick="toggleChat()"
            style="background:transparent; border:none;" title="Close Chat">
            <i data-lucide="x" style="width: 20px; height: 20px; stroke: #ffffff;"></i>
        </button>
    </div>

    <div class="chat-body" id="chat-body">
        <div id="chat-messages" class="p-3 d-flex flex-column gap-2">
            <!-- Messages load here -->
        </div>
        <div class="chat-input p-3">
            <form id="chat-form" class="d-flex gap-2">
                <input type="text" id="chat-input-msg" class="form-control" placeholder="Type a message..." required>
                <button type="submit" class="btn btn-pro-send">
                    <i data-lucide="send" style="width: 15px; height: 15px; stroke: #000; stroke-width: 2.5;"></i> Send
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    .pro-chat-circle-btn {
        position: fixed;
        bottom: 50px;
        right: 20px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 25px rgba(0, 242, 254, 0.45);
        z-index: 1035;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pro-chat-circle-btn:active {
        cursor: grabbing;
        transform: scale(0.95);
    }

    .pro-chat-circle-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 32px rgba(0, 242, 254, 0.6);
    }

    .pro-avatar-circle-inner {
        font-size: 1.3rem;
        font-weight: 800;
        color: #000000;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        pointer-events: none;
    }

    .chat-overlay {
        position: fixed;
        bottom: 185px;
        right: 20px;
        width: 350px;
        background: #090d16 !important;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
        z-index: 1035;
        overflow: hidden;
        display: none;
        border: 1px solid rgba(0, 242, 254, 0.35);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chat-overlay.open {
        display: block;
        animation: chatPopUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes chatPopUp {
        from {
            opacity: 0;
            transform: translateY(15px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .chat-header {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: #ffffff !important;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
        .pro-chat-circle-btn {
            bottom: 140px;
            right: 16px;
        }

        .chat-overlay {
            bottom: 180px;
            right: 12px;
            width: calc(100vw - 24px);
            max-width: 360px;
        }
    }

    .chat-body {
        display: block;
    }

    #chat-messages {
        height: 300px;
        overflow-y: auto;
        background: #090d16 !important;
    }

    .chat-message {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 0.88rem;
        margin-bottom: 4px;
        line-height: 1.4;
    }

    .chat-message.sent {
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #000000 !important;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        font-weight: 600;
    }

    .chat-message.received {
        background: #1e293b !important;
        color: #f8fafc !important;
        border: 1px solid rgba(255, 255, 255, 0.1);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .chat-input {
        background: #151d2d !important;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #chat-input-msg {
        background: #0c121e !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 10px;
        font-size: 0.88rem;
    }

    #chat-input-msg::placeholder {
        color: rgba(255, 255, 255, 0.5) !important;
    }

    .btn-pro-send {
        background: linear-gradient(135deg, #00f2fe, #4facfe) !important;
        color: #000000 !important;
        font-weight: 700 !important;
        border: none !important;
        border-radius: 10px !important;
        padding: 8px 16px !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px !important;
        font-size: 0.88rem !important;
        flex-shrink: 0 !important;
    }
</style>

<script>
    (function () {
        const clientId = "{{ client.id }}";
        const clientRole = "user";
        const circleBtn = document.getElementById('pro-chat-circle-btn');
        const overlay = document.getElementById('chat-overlay');

        window.toggleChat = function () {
            const badge = document.getElementById('pro-chat-badge');
            if (!overlay) return;

            overlay.classList.toggle('open');
            if (badge) badge.style.display = 'none';

            if (overlay.classList.contains('open')) {
                loadMessages();
                if (!window.chatInterval) {
                    window.chatInterval = setInterval(loadMessages, 5000);
                }
            } else {
                if (window.chatInterval) {
                    clearInterval(window.chatInterval);
                    window.chatInterval = null;
                }
            }
            if (window.lucide) lucide.createIcons();
        };

        // Make circle button draggable (mouse & touch)
        if (circleBtn) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            let dragMoved = false;

            function onStart(e) {
                isDragging = true;
                dragMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX;
                startY = clientY;
                const rect = circleBtn.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                circleBtn.style.transition = 'none';
            }

            function onMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                    dragMoved = true;
                }

                if (dragMoved) {
                    e.preventDefault();
                    let newLeft = initialLeft + deltaX;
                    let newTop = initialTop + deltaY;

                    // Boundary check
                    const maxLeft = window.innerWidth - circleBtn.offsetWidth - 10;
                    const maxTop = window.innerHeight - circleBtn.offsetHeight - 10;
                    newLeft = Math.max(10, Math.min(newLeft, maxLeft));
                    newTop = Math.max(10, Math.min(newTop, maxTop));

                    circleBtn.style.left = newLeft + 'px';
                    circleBtn.style.top = newTop + 'px';
                    circleBtn.style.right = 'auto';
                    circleBtn.style.bottom = 'auto';

                    // Reposition chat window relative to bubble
                    if (overlay) {
                        let overlayTop = newTop - 340;
                        if (overlayTop < 10) overlayTop = newTop + 65;
                        let overlayLeft = newLeft - 280;
                        if (overlayLeft < 10) overlayLeft = 10;
                        if (overlayLeft + 350 > window.innerWidth) overlayLeft = window.innerWidth - 360;
                        overlay.style.top = overlayTop + 'px';
                        overlay.style.left = overlayLeft + 'px';
                        overlay.style.right = 'auto';
                        overlay.style.bottom = 'auto';
                    }
                }
            }

            function onEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                circleBtn.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
                if (!dragMoved) {
                    toggleChat();
                }
            }

            circleBtn.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            circleBtn.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

        async function loadMessages() {
            try {
                const res = await fetch(`/chat/history?other_id=${clientId}&other_role=${clientRole}`);
                const messages = await res.json();

                const container = document.getElementById('chat-messages');
                if (!container) return;

                const prevCount = container.children.length;
                container.innerHTML = '';

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    const isSent = msg.sender_id == '{{ session.user_id }}' && msg.sender_role != 'user';
                    div.className = `chat-message ${isSent ? 'sent' : 'received'}`;
                    div.textContent = msg.message;
                    container.appendChild(div);
                });

                if (messages.length > prevCount && overlay && !overlay.classList.contains('open')) {
                    const badge = document.getElementById('pro-chat-badge');
                    if (badge) badge.style.display = 'inline-block';
                }

                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Failed to load chat history", e);
            }
        }

        const chatForm = document.getElementById('chat-form');
        if (chatForm) {
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input-msg');
                const message = input.value.trim();
                if (!message) return;

                try {
                    const res = await fetch('/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            receiver_id: clientId,
                            receiver_role: clientRole,
                            message: message
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        input.value = '';
                        loadMessages();
                    }
                } catch (e) {
                    console.error("Failed to send message", e);
                }
            });
        }

        if (window.location.search.includes('chat=open')) {
            setTimeout(function () {
                if (overlay && !overlay.classList.contains('open')) {
                    toggleChat();
                }
            }, 300);
        }
    })();
</script>
{% endif %}

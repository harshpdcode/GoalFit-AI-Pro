{% extends 'professional/pro_base.html' %}
{% block title %}Add Transformation{% endblock %}
{% block page_title %}Add Transformation{% endblock %}
{% block page_subtitle %}Upload a client success story{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="pro-card">
            <form action="/pro/transformations/add" method="POST">
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="pro-form-label">Client Name</label>
                        <input type="text" name="client_name" class="pro-form-control" placeholder="e.g. Rahul" required>
                    </div>
                    <div class="col-md-6">
                        <label class="pro-form-label">Before Weight (kg)</label>
                        <input type="number" step="0.1" name="before_weight" class="pro-form-control" placeholder="95" required>
                    </div>
                    <div class="col-md-6">
                        <label class="pro-form-label">After Weight (kg)</label>
                        <input type="number" step="0.1" name="after_weight" class="pro-form-control" placeholder="78" required>
                    </div>
                    <div class="col-md-12">
                        <label class="pro-form-label">Time / Duration</label>
                        <input type="text" name="duration" class="pro-form-control" placeholder="e.g. 5 months" required>
                    </div>
                    <div class="col-md-12">
                        <label class="pro-form-label">Story / Description</label>
                        <textarea name="description" class="pro-form-control" rows="3" placeholder="Briefly describe the transformation journey..."></textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/pro/transformations/" class="btn-pro-ghost" style="padding:10px 20px;">Cancel</a>
                    <button type="submit" class="btn-pro-primary" style="padding:10px 24px;">Save Story</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
